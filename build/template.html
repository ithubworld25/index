:10px;color:#344054;padding:2px}.swatch{width:9px;height:9px;border-radius:999px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;flex:1}.map-pane{min-width:0;display:flex;flex-direction:column}.map-status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;color:var(--muted);font-size:11px}.status-left{display:flex;gap:12px;flex-wrap:wrap}.self-test{font-weight:750}.self-test.ok{color:var(--ok)}.board-scroll{position:relative;overflow:auto;flex:1;padding:0 14px 28px;scroll-behavior:smooth}.board-content{position:relative;min-width:2520px;min-height:720px}.links{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}.semesters{display:grid;grid-template-columns:repeat(8,300px);gap:14px;position:relative;z-index:4;align-items:start}.semester{background:rgba(255,255,255,.72);border:1px solid #dbe1ea;border-radius:14px;min-height:650px;padding:10px;transition:.2s}.semester.sem-focus{outline:3px solid rgba(37,99,235,.28);background:#f8fbff}.sem-head{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.95);border-bottom:1px solid #e6eaf0;margin:-10px -10px 10px;padding:10px;border-radius:14px 14px 0 0}.sem-head strong{display:block;font-size:13px}.sem-head span{color:var(--muted);font-size:10px}.cards{display:flex;flex-direction:column;gap:8px}.discipline{position:relative;background:#fff;border:1px solid #d7dee9;border-radius:11px;padding:9px;box-shadow:0 2px 8px rgba(16,24,40,.04);transition:.15s;cursor:pointer}.discipline:hover{border-color:#8aa6d9;box-shadow:0 4px 12px rgba(16,24,40,.09)}.discipline.selected{outline:3px solid rgba(37,99,235,.25);border-color:#2563eb}.discipline.error-node{border-left:4px solid var(--danger)}.discipline.warning-node{border-left:4px solid #d59b00}.discipline.zero{opacity:.6;background:#f3f4f6}.discipline.related{box-shadow:0 0 0 2px rgba(37,99,235,.16)}.discipline.candidate{box-shadow:0 0 0 2px rgba(230,149,0,.25)}.card-title{font-size:12px;font-weight:760;line-height:1.25;padding-right:28px}.card-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:9px;margin-top:5px}.issue-count{position:absolute;right:7px;top:7px;min-width:21px;height:21px;border-radius:999px;background:#fee2e2;color:#a71d2a;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid currentColor;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:760;background:#fff;line-height:1.2}.chip.soft{border-style:dashed}.no-comps{font-size:9px;color:#98a2b3;font-style:italic}.sidebar{background:#fff;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;position:sticky;top:73px;height:calc(100vh - 73px)}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.tab{padding:11px;border:0;background:#f8fafc;color:#667085;font-weight:750;font-size:12px}.tab.active{background:#fff;color:#1d4ed8;border-bottom:2px solid #1d4ed8}.panel{overflow:auto;padding:14px;flex:1}.empty-panel{color:var(--muted);font-size:12px;line-height:1.55}.panel h2{font-size:16px;margin:0 0 5px}.panel h3{font-size:12px;margin:16px 0 7px;text-transform:uppercase;letter-spacing:.04em;color:#475467}.panel p{font-size:12px;line-height:1.5}.facts{display:grid;grid-template-columns:126px minmax(0,1fr);gap:5px 8px;font-size:11px}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:620;overflow-wrap:anywhere}.source-table{width:100%;border-collapse:collapse;font-size:10px}.source-table th,.source-table td{border:1px solid #e3e7ee;padding:5px;text-align:left;vertical-align:top}.source-table th{background:#f8fafc}.related-list,.node-list{display:flex;flex-direction:column;gap:5px}.related-item,.node-link{border:1px solid #dfe4ec;background:#fff;border-radius:8px;padding:7px;text-align:left;font-size:10px}.related-item:hover,.node-link:hover{border-color:#8ca9dd}.related-codes{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}.error-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.metric{border:1px solid #dfe4ec;border-radius:9px;padding:6px 8px;font-size:10px;background:#f9fafb}.error-list{display:flex;flex-direction:column;gap:7px}.error-card{width:100%;text-align:left;border:1px solid #dfe4ec;border-left:4px solid #d49a00;border-radius:10px;background:#fff;padding:9px}.error-card.error{border-left-color:var(--danger)}.error-card:hover{background:#f8fafc}.error-card strong{display:block;font-size:11px;margin-bottom:3px}.error-card span{font-size:9px;color:var(--muted)}.error-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#667085}.diagnostic{border:1px solid #e1e6ee;border-radius:10px;padding:9px;margin:8px 0;background:#fafbfc}.diagnostic.error{border-color:#f3b5ba;background:#fff7f7}.diagnostic.warning{border-color:#f0d48a;background:#fffaf0}.diagnostic-label{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:750}.diagnostic-value{font-size:11px;line-height:1.45;margin-top:3px}.action-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.edit-grid{display:flex;flex-direction:column;gap:5px}.edit-row{display:grid;grid-template-columns:10px minmax(0,1fr) 58px;gap:6px;align-items:center;font-size:10px}.coef-input{width:58px;border:1px solid #ccd5e1;border-radius:6px;padding:4px}.scope{width:100%;border:1px solid #ccd5e1;border-radius:8px;padding:7px;margin:7px 0}.line-continuation{stroke:#98a2b3;stroke-width:1.5;stroke-dasharray:6 4;fill:none;opacity:.8}.line-competency{fill:none;opacity:.58;stroke-linecap:round}.line-focus{fill:none;opacity:.88;stroke-linecap:round}.line-soft{stroke-dasharray:5 4}.legend{display:flex;gap:10px;flex-wrap:wrap}.legend span{font-size:9px;color:#667085}.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:4px;background:#64748b}.legend i.dashed{background:repeating-linear-gradient(90deg,#64748b 0 5px,transparent 5px 9px)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#172033;color:#fff;border-radius:9px;padding:9px 13px;font-size:11px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:1200px){.group-grid{grid-template-columns:repeat(2,minmax(220px,1fr))}.workspace{grid-template-columns:minmax(0,1fr) 340px}}@media(max-width:850px){.topbar{grid-template-columns:1fr}.top-actions{justify-content:flex-start}.workspace{display:block}.sidebar{position:relative;top:auto;height:auto;border-left:0;border-top:1px solid var(--line)}.group-grid{grid-template-columns:1fr}.board-scroll{height:70vh}}

<body>
<div class="app">
<header class="topbar">
  <div class="title"><h1>Траектория обучения · Информационная безопасность</h1><p>10.02.05 · 2026–2027 · Кибер / DevOps · автономная версия v0.3</p></div>
  <div class="top-actions">
    <div class="role-switch" id="roleSwitch"></div>
    <button class="btn ghost" id="fitBtn">FIT</button>
    <button class="btn ghost" id="editBtn">Редактирование</button>
    <button class="btn ghost" id="exportDataBtn">Экспорт данных</button>
    <button class="btn ghost" id="exportChangesBtn">Экспорт изменений</button>

  </div>
</header>
<section class="filters">
  <div class="filters-head">
    <input class="search" id="searchInput" placeholder="Поиск дисциплины или кода">

</section>
<div class="workspace">
  <main class="map-pane">
    <div class="map-status"><div class="status-left"><span id="roleLabel"></span><span id="visibleCount"></span><span id="lineCount"></span></div><div class="legend"><span><i></i> наследуемая компетенция</span><span><i class="dashed"></i> место оценивания Soft Skill</span><span class="self-test" id="selfTestBadge">Проверка интерфейса…</span></div></div>
    <div class="board-scroll" id="boardScroll"><div class="board-content" id="boardContent"><svg class="links" id="links"></svg><div class="semesters" id="semesters"></div></div></div>
  </main>

<script>
const BOOT = __TRAJECTORY_DATA_JSON__;
window.__TRAJECTORY_DATA__ = BOOT;
const deep = value => JSON.parse(JSON.stringify(value));
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byId = id => document.getElementById(id);
const catalog = BOOT.catalog;
const compByIdx = Object.fromEntries(catalog.map(c => [String(c.idx), c]));
const initialData = deep(BOOT);
const state = {data:deep(BOOT),role:'kiber',selectedComps:new Set(),showZero:true,showContinuations:true,onlyViolations:false,query:'',selectedNode:null,selectedError:null,activeTab:'details',editMode:false,changeLog:[],semesterFocus:null,lineCount:0};

function toast(message){const el=byId('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function roleData(role=state.role){return state.data.roles[role]}
function allNodes(){return Object.values(state.data.roles).flatMap(r=>r.nodes)}
function nodeById(id){return allNodes().find(n=>n.id===id)||null}
function groupIndices(group){return state.data.groups[group].indices}
function isSoft(idx){return Number(idx)>=13&&Number(idx)<=17}
function nodeCompetencies(node){return Object.keys(node.competencies).map(Number).sort((a,b)=>a-b)}
function commonCompetencies(a,b){const bset=new Set(Object.keys(b.competencies));return Object.keys(a.competencies).filter(idx=>bset.has(idx)).map(Number).sort((x,y)=>x-y)}
function slug(value){let h=2166136261;for(const ch of String(value)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}

function dynamicErrorsRaw(){
  const out=[];
  for(const [role,payload] of Object.entries(state.data.roles)){
    for(const node of payload.nodes){
      const hard=Object.keys(node.competencies).filter(i=>Number(i)<13).length;
      if(node.hours>0&&!node.physical_exception&&hard===0){out.push({rule:'HARD_MISSING',severity:'error',title:'В дисциплине отсутствует hard-компетенция',summary:`${node.name} · ${node.semester} семестр`,semester:node.semester,roles:[role],node_ids:{[role]:[node.id]},current:'0 внутренних hard-компетенций',expected:'Не менее 1 внутренней hard-компетенции',source:'Правило HARD-01',details:'Исключения: дисциплины с 0 часов и физическая культура.',action:'Назначить hard-компетенцию или оформить подтверждённое исключение.',dynamic:true})}
    }
    for(let sem=1;sem<=6;sem++){
      const semNodes=payload.nodes.filter(n=>n.semester===sem&&n.hours>0);
      for(let idx=13;idx<=17;idx++){
        const assessed=semNodes.filter(n=>Object.prototype.hasOwnProperty.call(n.competencies,String(idx)));
        if(assessed.length<3){out.push({rule:'SOFT_DEFICIT',severity:'error',title:'Недостаточно мест оценивания Soft Skill',summary:`${compByIdx[String(idx)].name} · ${sem} семестр · ${assessed.length}/3`,semester:sem,roles:[role],node_ids:{[role]:[]},existing_node_ids:{[role]:assessed.map(n=>n.id)},candidate_node_ids:{[role]:semNodes.filter(n=>!Object.prototype.hasOwnProperty.call(n.competencies,String(idx))).map(n=>n.id)},comp_idx:idx,current:`${assessed.length} дисциплины из 3`,expected:'Не менее 3 дисциплин в семестре',source:'Правило SOFT-01',details:'Soft Skill показывает места оценивания, а не наследуемую траекторию. Для 7–8 семестров правило не применяется.',action:`Рассмотреть ещё минимум ${3-assessed.length} дисциплины для оценивания.`,dynamic:true})}
      }
    }
  }
  return out;
}
function mergeErrors(items){
  const map=new Map();
  for(const item of items){const name=(item.summary||'').split(' · ')[0];const key=[item.rule,item.semester,item.comp_idx??'',name,item.current,item.expected].join('|');if(!map.has(key)){map.set(key,deep(item))}else{const t=map.get(key);for(const r of item.roles||[])if(!t.roles.includes(r))t.roles.push(r);for(const f of ['node_ids','existing_node_ids','candidate_node_ids'])if(item[f]){t[f]??={};for(const [r,ids] of Object.entries(item[f])){t[f][r]??=[];for(const id of ids)if(!t[f][r].includes(id))t[f][r].push(id)}}}}
  const sev={error:0,warning:1,info:2};const result=[...map.values()].sort((a,b)=>(sev[a.severity]-sev[b.severity])||(a.semester??99)-(b.semester??99)||a.rule.localeCompare(b.rule,'ru')||a.summary.localeCompare(b.summary,'ru'));
  result.forEach(e=>{e.id=e.dynamic?`LIVE-${e.rule}-${e.semester}-${e.comp_idx??slug(e.summary)}`:(e.id||`SRC-${slug(JSON.stringify(e))}`)});return result;
}
function currentErrors(){return mergeErrors([...state.data.source_errors,...dynamicErrorsRaw()])}
function errorById(id){return currentErrors().find(e=>e.id===id)||null}
function errorsForNode(nodeId,role=state.role){return currentErrors().filter(e=>((e.node_ids||{})[role]||[]).includes(nodeId))}
function nodeSetForViolations(role=state.role){const set=new Set();for(const e of currentErrors().filter(e=>e.roles.includes(role))){for(const f of ['node_ids','existing_node_ids','candidate_node_ids'])for(const id of ((e[f]||{})[role]||[]))set.add(id)}return set}

function renderRoleSwitch(){const root=byId('roleSwitch');root.innerHTML='';for(const role of state.data.meta.roles_order){const b=document.createElement('button');b.className='role-btn'+(state.role===role?' active':'');b.textContent=state.data.roles[role].label;b.onclick=()=>{state.role=role;state.selectedNode=null;state.selectedError=null;state.semesterFocus=null;renderAll()};root.appendChild(b)}}
function renderGroupControls(){const root=byId('groupGrid');root.innerHTML='';for(const [group,info] of Object.entries(state.data.groups)){const box=document.createElement('div');box.className='group-box';box.innerHTML=`<div class="group-title"><span>${esc(info.label)}</span><span class="group-actions"><button class="mini show-group" data-group="${group}">Показать все</button><button class="mini hide-group" data-group="${group}">Выключить</button></span></div><div class="comp-list">${info.indices.map(idx=>{const c=compByIdx[String(idx)];return `<label class="comp-option"><input type="checkbox" data-comp="${idx}" ${state.selectedComps.has(idx)?'checked':''}><span class="swatch" style="background:${c.color}"></span><span title="${esc(c.name)}">${esc(c.code)} · ${esc(c.name)}</span></label>`}).join('')}</div>`;root.appendChild(box)}
  root.querySelectorAll('.show-group').forEach(b=>b.onclick=()=>{groupIndices(b.dataset.group).forEach(i=>state.selectedComps.add(i));renderAll()});
  root.querySelectorAll('.hide-group').forEach(b=>b.onclick=()=>{groupIndices(b.dataset.group).forEach(i=>state.selectedComps.delete(i));renderAll()});
  root.querySelectorAll('[data-comp]').forEach(cb=>cb.onchange=()=>{const idx=Number(cb.dataset.comp);cb.checked?state.selectedComps.add(idx):state.selectedComps.delete(idx);renderAll()});
}
function nodeVisible(node){if(!state.showZero&&node.hours===0)return false;if(state.query){const q=state.query.toLowerCase();if(!`${node.name} ${node.code||''}`.toLowerCase().includes(q))return false}if(state.onlyViolations&&!nodeSetForViolations().has(node.id))return false;return true}
function issueClass(node){const list=errorsForNode(node.id);if(list.some(e=>e.severity==='error'))return' error-node';if(list.length)return' warning-node';return''}
function chipHtml(idx,coef){const c=compByIdx[String(idx)];return `<span class="chip ${c.group==='soft'?'soft':''}" style="color:${c.color}" title="${esc(c.name)}"><span>${esc(c.code)}</span><b>${coef}</b></span>`}
function cardHtml(node){const issues=errorsForNode(node.id);const related=state.selectedNode&&state.selectedNode!==node.id&&commonCompetencies(nodeById(state.selectedNode),node).length>0;const selected=state.selectedNode===node.id;const err=state.selectedError?errorById(state.selectedError):null;const existing=err&&((err.existing_node_ids||{})[state.role]||[]).includes(node.id);const candidate=err&&((err.candidate_node_ids||{})[state.role]||[]).includes(node.id);const chips=nodeCompetencies(node).map(i=>chipHtml(i,node.competencies[String(i)])).join('');return `<article class="discipline${node.hours===0?' zero':''}${issueClass(node)}${selected?' selected':''}${related?' related':''}${existing?' related':''}${candidate?' candidate':''}" data-node-id="${node.id}">${issues.length?`<span class="issue-count">${issues.length}</span>`:''}<div class="card-title">${esc(node.name)}</div><div class="card-meta"><span>${esc(node.code||'без кода')}</span><span>${node.hours} ч.</span><span>${node.source_mode==='split_from_up'?'часть составной дисциплины':'УП'}</span></div><div class="chips">${chips||'<span class="no-comps">компетенции не назначены</span>'}</div></article>`}
function renderMap(){const root=byId('semesters');root.innerHTML='';let visible=0;for(let sem=1;sem<=8;sem++){const all=roleData().nodes.filter(n=>n.semester===sem);const nodes=all.filter(nodeVisible);visible+=nodes.length;const col=document.createElement('section');col.className='semester'+(state.semesterFocus===sem?' sem-focus':'');col.dataset.semester=sem;col.innerHTML=`<div class="sem-head"><strong>${sem} семестр · ${(sem+1)>>1} курс</strong><span>${nodes.length} из ${all.length} дисциплин</span></div><div class="cards">${nodes.map(cardHtml).join('')}</div>`;root.appendChild(col)}
  root.querySelectorAll('[data-node-id]').forEach(el=>el.onclick=()=>selectNode(el.dataset.nodeId));byId('visibleCount').textContent=`Видимо: ${visible} узлов`;byId('roleLabel').textContent=`БР: ${roleData().label}`;requestAnimationFrame(drawLines)}
function point(el,side='center'){const base=byId('boardContent').getBoundingClientRect();const r=el.getBoundingClientRect();return{x:(side==='left'?r.left:side==='right'?r.right:r.left+r.width/2)-base.left,y:r.top-base.top+r.height/2}}
function pathBetween(a,b,offset=0){let p1=a,p2=b;if(p1.x>p2.x)[p1,p2]=[p2,p1];const dx=Math.max(50,(p2.x-p1.x)*.45);return`M ${p1.x} ${p1.y+offset} C ${p1.x+dx} ${p1.y+offset}, ${p2.x-dx} ${p2.y+offset}, ${p2.x} ${p2.y+offset}`}
function svgPath(d,color,width,classes){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('stroke',color);p.setAttribute('stroke-width',String(width));p.setAttribute('class',classes);return p}
function visibleElements(){return new Map([...document.querySelectorAll('[data-node-id]')].map(el=>[el.dataset.nodeId,el]))}
function drawSelectedCompetency(svg,elements,idx){const c=compByIdx[String(idx)];const nodes=roleData().nodes.filter(n=>elements.has(n.id)&&Object.prototype.hasOwnProperty.call(n.competencies,String(idx)));const bySem=new Map();for(const n of nodes){if(!bySem.has(n.semester))bySem.set(n.semester,[]);bySem.get(n.semester).push(n)}const sems=[...bySem.keys()].sort((a,b)=>a-b);for(let s=0;s<sems.length-1;s++){const left=bySem.get(sems[s]),right=bySem.get(sems[s+1]);for(const a of left){const ae=elements.get(a.id);const ay=point(ae,'right').y;const nearest=[...right].sort((x,y)=>Math.abs(point(elements.get(x.id),'left').y-ay)-Math.abs(point(elements.get(y.id),'left').y-ay))[0];if(!nearest)continue;const coef=Math.max(a.competencies[String(idx)]||1,nearest.competencies[String(idx)]||1);svg.appendChild(svgPath(pathBetween(point(ae,'right'),point(elements.get(nearest.id),'left')),c.color,1+coef*.55,`line-competency ${c.group==='soft'?'line-soft':''}`));state.lineCount++}}}
function drawFocus(svg,elements){const selected=nodeById(state.selectedNode);if(!selected||!elements.has(selected.id))return;for(const other of roleData().nodes){if(other.id===selected.id||other.semester===selected.semester||!elements.has(other.id))continue;const shared=commonCompetencies(selected,other);if(!shared.length)continue;shared.forEach((idx,i)=>{const c=compByIdx[String(idx)];const left=selected.semester<other.semester?selected:other;const right=selected.semester<other.semester?other:selected;const offset=(i-(shared.length-1)/2)*4;const coef=Math.max(selected.competencies[String(idx)]||1,other.competencies[String(idx)]||1);svg.appendChild(svgPath(pathBetween(point(elements.get(left.id),'right'),point(elements.get(right.id),'left'),offset),c.color,1.6+coef*.5,`line-focus ${c.group==='soft'?'line-soft':''}`));state.lineCount++})}}
function drawLines(){const svg=byId('links'),content=byId('boardContent');svg.innerHTML='';svg.setAttribute('width',String(content.scrollWidth));svg.setAttribute('height',String(content.scrollHeight));svg.setAttribute('viewBox',`0 0 ${content.scrollWidth} ${content.scrollHeight}`);state.lineCount=0;const elements=visibleElements();if(state.showContinuations)for(const link of roleData().continuations){if(!elements.has(link.from)||!elements.has(link.to))continue;svg.appendChild(svgPath(pathBetween(point(elements.get(link.from),'right'),point(elements.get(link.to),'left')),'#98a2b3',1.5,'line-continuation'));state.lineCount++}for(const idx of state.selectedComps)drawSelectedCompetency(svg,elements,idx);drawFocus(svg,elements);byId('lineCount').textContent=`Линий: ${state.lineCount}`}

function selectNode(id){state.selectedNode=id;state.selectedError=null;state.activeTab='details';state.semesterFocus=null;renderAll(false)}
function focusNode(id){const node=nodeById(id);if(!node)return;state.selectedNode=id;state.selectedError=null;state.activeTab='details';state.semesterFocus=node.semester;renderAll();setTimeout(()=>document.querySelector(`[data-node-id="${CSS.escape(id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}),50)}
function selectError(id){const e=errorById(id);if(!e)return;if(!e.roles.includes(state.role))state.role=e.roles[0];state.selectedError=id;state.selectedNode=null;state.activeTab='details';state.semesterFocus=e.semester||null;if(e.comp_idx!==undefined)state.selectedComps.add(Number(e.comp_idx));renderAll();setTimeout(()=>{const ids=((e.node_ids||{})[state.role]||[]);if(ids[0])document.querySelector(`[data-node-id="${CSS.escape(ids[0])}"]`)?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});else document.querySelector(`[data-semester="${e.semester}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})},50)}
function relatedNodes(node){return roleData().nodes.filter(n=>n.id!==node.id&&n.semester!==node.semester&&commonCompetencies(node,n).length).sort((a,b)=>a.semester-b.semester||b.name.localeCompare(a.name,'ru'))}
function sourceTable(node){return `<table class="source-table"><thead><tr><th>Источник</th><th>Название</th><th>Часы</th><th>Код</th></tr></thead><tbody><tr><td>Стыковочный УП</td><td>${esc(node.up_name||'—')}</td><td>${node.up_hours??'—'}</td><td>${esc(node.up_code||'—')}</td></tr><tr><td>Матрица</td><td>${esc(node.matrix_name||'—')}</td><td>${node.matrix_hours??'—'}</td><td>${esc(node.matrix_code||'—')}</td></tr><tr><td>ФГОС-контур</td><td>официальная основа</td><td>${node.fgos_hours??'—'}</td><td>${esc(node.up_code||node.code||'—')}</td></tr></tbody></table>`}
function editHtml(node){if(!state.editMode)return'';return `<h3>Редактирование компетенций</h3><select class="scope" id="editScope"><option value="current">Только эта реализация</option><option value="shared" ${node.shared_key?'':'disabled'}>Общая реализация обеих БР</option><option value="canonical">Все реализации с тем же названием и семестром</option></select><div class="edit-grid">${catalog.map(c=>`<label class="edit-row"><span class="swatch" style="background:${c.color}"></span><span>${esc(c.code)} · ${esc(c.name)}</span><input class="coef-input" type="number" min="0" max="4" step="1" data-edit-comp="${c.idx}" value="${node.competencies[String(c.idx)]||0}"></label>`).join('')}</div><div class="action-row"><button class="btn active" id="applyEdit">Применить</button></div>`}
function nodePanel(node){const related=relatedNodes(node);const comps=nodeCompetencies(node);return `<h2>${esc(node.name)}</h2><p>${esc(node.code||'без кода')} · ${node.semester} семестр · ${node.hours} ч.</p><dl class="facts"><dt>Бизнес-роль</dt><dd>${esc(roleData().label)}</dd><dt>Источник узла</dt><dd>${node.source_mode==='up'?'стыковочный УП':node.source_mode==='split_from_up'?'часть составной дисциплины УП':'матрица без привязки'}</dd><dt>Hard</dt><dd>${comps.filter(i=>i<13).length}</dd><dt>Soft</dt><dd>${comps.filter(i=>i>=13&&i<=17).length}</dd><dt>ОК</dt><dd>${comps.filter(i=>i>=18&&i<=26).length}</dd><dt>ПК</dt><dd>${comps.filter(i=>i>=27).length}</dd></dl><h3>Сопоставление источников</h3>${sourceTable(node)}<h3>Компетенции</h3><div class="chips">${comps.map(i=>chipHtml(i,node.competencies[String(i)])).join('')||'<span class="no-comps">нет назначенных компетенций</span>'}</div><h3>Связанные дисциплины</h3><div class="related-list">${related.slice(0,80).map(n=>{const common=commonCompetencies(node,n);return `<button class="related-item" data-focus-node="${n.id}"><b>${n.semester} сем. · ${esc(n.name)}</b><span class="related-codes">${common.map(i=>`<span class="chip ${isSoft(i)?'soft':''}" style="color:${compByIdx[String(i)].color}">${esc(compByIdx[String(i)].code)}</span>`).join('')}</span></button>`}).join('')||'<span class="no-comps">связи не найдены</span>'}</div>${editHtml(node)}`}
function diagnostic(label,value,cls=''){return `<div class="diagnostic ${cls}"><div class="diagnostic-label">${esc(label)}</div><div class="diagnostic-value">${esc(value)}</div></div>`}
function nodeButtons(ids){return (ids||[]).map(id=>{const n=nodeById(id);return n?`<button class="node-link" data-focus-node="${id}">${n.semester} сем. · ${esc(n.name)}</button>`:''}).join('')}
function errorPanel(e){const roleNames=e.roles.map(r=>state.data.roles[r].label).join(', ');const ids=((e.node_ids||{})[state.role]||[]);const existing=((e.existing_node_ids||{})[state.role]||[]);const candidates=((e.candidate_node_ids||{})[state.role]||[]);return `<h2>${esc(e.title)}</h2><p><span class="error-code">${esc(e.id)} · ${esc(e.rule)}</span><br>${esc(e.summary)}</p>${diagnostic('Правило',e.details,e.severity)}${diagnostic('Текущее состояние',e.current)}${diagnostic('Ожидаемое состояние',e.expected)}${diagnostic('Источник',e.source)}${diagnostic('Затронутые БР',roleNames)}${diagnostic('Требуемое действие',e.action)}${ids.length?`<h3>Точка ошибки</h3><div class="node-list">${nodeButtons(ids)}</div>`:''}${e.rule==='SOFT_DEFICIT'?`<h3>Где уже оценивается</h3><div class="node-list">${nodeButtons(existing)||'<span class="no-comps">нет дисциплин</span>'}</div><h3>Дисциплины семестра для рассмотрения</h3><div class="node-list">${nodeButtons(candidates)||'<span class="no-comps">нет кандидатов</span>'}</div>`:''}<div class="action-row"><button class="btn active" id="showErrorOnMap">Показать на карте</button>${ids.length?'<button class="btn ghost" id="editErrorNode">Редактировать дисциплину</button>':''}<button class="btn ghost" id="exportError">Экспортировать запись</button></div>`}
function errorsPanel(){const errors=currentErrors().filter(e=>e.roles.includes(state.role));const count=kind=>errors.filter(e=>e.severity===kind).length;return `<div class="error-summary"><span class="metric">Ошибки: <b>${count('error')}</b></span><span class="metric">Предупреждения: <b>${count('warning')}</b></span><span class="metric">Всего: <b>${errors.length}</b></span></div><div class="error-list">${errors.map(e=>`<button class="error-card ${e.severity}" data-error-id="${e.id}"><strong>${esc(e.title)}</strong><span><span class="error-code">${esc(e.id)} · ${esc(e.rule)}</span><br>${esc(e.summary)}</span></button>`).join('')||'<div class="empty-panel">Нарушения не обнаружены.</div>'}</div>`}
function overviewPanel(){const errors=currentErrors().filter(e=>e.roles.includes(state.role));return `<h2>${esc(roleData().label)}</h2><p>Выберите дисциплину, линию компетенции или запись реестра ошибок.</p><dl class="facts"><dt>Семестры</dt><dd>8</dd><dt>Дисциплины</dt><dd>${roleData().nodes.length}</dd><dt>Внутренние hard</dt><dd>13</dd><dt>Soft Skills</dt><dd>5</dd><dt>ОК ФГОС</dt><dd>9</dd><dt>ПК ФГОС</dt><dd>16</dd><dt>Ошибки и предупреждения</dt><dd>${errors.length}</dd></dl><h3>Навигация</h3><p>Компетенции всегда видны на карточках. Кнопки «Показать все» включают линии всей группы. Soft Skills показаны пунктиром как места оценивания. При выборе дисциплины каждая общая компетенция получает собственную цветную линию.</p>`}
function renderPanel(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.activeTab));const panel=byId('panel');if(state.activeTab==='errors'){panel.innerHTML=errorsPanel()}else if(state.selectedError&&errorById(state.selectedError)){panel.innerHTML=errorPanel(errorById(state.selectedError))}else if(state.selectedNode&&nodeById(state.selectedNode)){panel.innerHTML=nodePanel(nodeById(state.selectedNode))}else{panel.innerHTML=overviewPanel()}
  panel.querySelectorAll('[data-error-id]').forEach(b=>b.onclick=()=>selectError(b.dataset.errorId));panel.querySelectorAll('[data-focus-node]').forEach(b=>b.onclick=()=>focusNode(b.dataset.focusNode));byId('applyEdit')?.addEventListener('click',applyEdits);byId('showErrorOnMap')?.addEventListener('click',()=>selectError(state.selectedError));byId('editErrorNode')?.addEventListener('click',()=>{const e=errorById(state.selectedError);const id=((e.node_ids||{})[state.role]||[])[0];if(id){state.editMode=true;state.selectedNode=id;state.selectedError=null;renderAll()}});byId('exportError')?.addEventListener('click',()=>downloadJSON(`ошибка_${state.selectedError}.json`,errorById(state.selectedError)))}
function renderErrorCount(){const errors=currentErrors();byId('errorCount').textContent=`(${errors.filter(e=>e.roles.includes(state.role)).length})`}
function renderAll(rebuildControls=true){renderRoleSwitch();if(rebuildControls)renderGroupControls();renderMap();renderErrorCount();renderPanel();byId('editBtn').classList.toggle('active',state.editMode)}

function applyEdits(){const node=nodeById(state.selectedNode);if(!node)return;const next={};document.querySelectorAll('[data-edit-comp]').forEach(input=>{const v=Number(input.value);if(Number.isInteger(v)&&v>=1&&v<=4)next[input.dataset.editComp]=v});const scope=byId('editScope').value;let targets=[node];if(scope==='shared'&&node.shared_key)targets=allNodes().filter(n=>n.shared_key===node.shared_key);if(scope==='canonical')targets=allNodes().filter(n=>n.canonical_key===node.canonical_key);const before=targets.map(n=>({id:n.id,competencies:deep(n.competencies)}));for(const target of targets)target.competencies=deep(next);state.changeLog.push({at:new Date().toISOString(),type:'competencies',scope,source_node:node.id,affected_nodes:targets.map(n=>n.id),before,after:deep(next)});toast(`Изменено реализаций: ${targets.length}`);renderAll()}
function downloadJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},200)}
function fitMap(){byId('boardScroll').scrollTo({left:0,top:0,behavior:'smooth'});toast('Карта возвращена к началу; используйте горизонтальную прокрутку для 8 семестров')}
function resetAll(){if(!confirm('Сбросить локальные изменения и фильтры?'))return;state.data=deep(initialData);state.role='kiber';state.selectedComps.clear();state.showZero=true;state.showContinuations=true;state.onlyViolations=false;state.query='';state.selectedNode=null;state.selectedError=null;state.editMode=false;state.changeLog=[];state.semesterFocus=null;byId('searchInput').value='';byId('showZero').checked=true;byId('showContinuations').checked=true;byId('onlyViolations').checked=false;renderAll();toast('Состояние сброшено')}
function bindStatic(){document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.activeTab=t.dataset.tab;renderPanel()});byId('searchInput').oninput=e=>{state.query=e.target.value.trim();renderAll(false)};byId('showZero').onchange=e=>{state.showZero=e.target.checked;renderAll(false)};byId('showContinuations').onchange=e=>{state.showContinuations=e.target.checked;drawLines()};byId('onlyViolations').onchange=e=>{state.onlyViolations=e.target.checked;renderAll(false)};byId('showAll').onclick=()=>{catalog.forEach(c=>state.selectedComps.add(c.idx));renderAll()};byId('clearAll').onclick=()=>{state.selectedComps.clear();renderAll()};byId('editBtn').onclick=()=>{state.editMode=!state.editMode;renderAll(false)};byId('exportDataBtn').onclick=()=>downloadJSON('траектория_ИБ_текущее_состояние.json',{...state.data,current_errors:currentErrors(),changes:state.changeLog});byId('exportChangesBtn').onclick=()=>downloadJSON('изменения_траектории_ИБ.json',state.changeLog);byId('fitBtn').onclick=fitMap;byId('resetBtn').onclick=resetAll;window.addEventListener('resize',()=>requestAnimationFrame(drawLines));byId('boardScroll').addEventListener('scroll',()=>requestAnimationFrame(drawLines),{passive:true})}
function selfTest(){const roleOk=['kiber','devops'].every(r=>state.data.roles[r]&&state.data.roles[r].nodes.length>0);const semOk=['kiber','devops'].every(r=>new Set(state.data.roles[r].nodes.map(n=>n.semester)).size===8);const ok=state.data.catalog.length===43&&roleOk&&semOk&&state.data.groups.soft.indices.length===5&&typeof selectError==='function'&&typeof applyEdits==='function';document.documentElement.dataset.selfTest=ok?'ok':'failed';const badge=byId('selfTestBadge');badge.textContent=ok?'Самопроверка: OK':'Самопроверка: ошибка';badge.classList.toggle('ok',ok);return{ok,catalog:state.data.catalog.length,roleOk,semOk,errors:currentErrors().length}}
window.__RUN_SELF_TEST__=selfTest;
document.addEventListener('DOMContentLoaded',()=>{bindStatic();renderAll();const result=selfTest();document.documentElement.dataset.runtimeReady='1';window.__RUNTIME_STATUS__=result});
</script>
</body>
