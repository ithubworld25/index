function selectedIssue(){return state.selectedIssueId?allIssues().find(i=>i.issue_id===state.selectedIssueId)||null:null}
function visibleNodes(){const role=roleObj();const q=state.search.trim().toLowerCase();return role.nodes.filter(node=>{if(!state.showZero&&node.hours===0)return false;if(q&&!`${node.name} ${node.code}`.toLowerCase().includes(q))return false;if(state.onlyIssues&&!nodeIssues(node.id).some(activeIssue))return false;return true})}
function renderMap(){const nodes=visibleNodes();const selected=selectedIssue();const sems=Array.from({length:PROFILE.semesters},(_,i)=>i+1);byId('semesters').style.gridTemplateColumns=`repeat(${PROFILE.semesters},286px)`;byId('semesters').innerHTML=sems.map(sem=>{const list=nodes.filter(n=>n.semester===sem);const semFocus=selected?.semester_ids?.includes(sem);return`<section class='semester ${semFocus?'sem-focus':''}' data-sem='${sem}'><div class='sem-head'><strong>${sem} семестр</strong><span>${list.length} дисциплин</span></div><div class='cards'>${list.map(node=>renderCard(node,selected)).join('')}</div></section>`}).join('');byId('semesters').querySelectorAll('[data-node-id]').forEach(card=>card.onclick=()=>{state.focusedNodeId=card.dataset.nodeId;state.selectedIssueId=null;state.tab='details';renderAll()});const naturalWidth=PROFILE.semesters*286+(PROFILE.semesters-1)*14;byId('boardContent').style.width=`${naturalWidth}px`;requestAnimationFrame(()=>{applyFit();drawLines()});byId('visibleCount').textContent=`узлов: ${nodes.length}/${roleObj().nodes.length}`}
function renderCard(node,issue){const visible=visibleCompIds(node);const filtered=state.activeCompIds.size&&visible.length===0;const cls=['discipline',node.id===state.focusedNodeId?'selected':'',filtered?'filtered-out':'',node.zero_hours?'zero':''];if(issue){if(issue.primary_node_ids?.includes(node.id))cls.push('issue-primary');else if(issue.existing_node_ids?.includes(node.id))cls.push('issue-existing');else if(issue.candidate_node_ids?.includes(node.id))cls.push('issue-candidate');else if(issue.related_node_ids?.includes(node.id))cls.push('issue-related')}return`<article class='${cls.filter(Boolean).join(' ')}' data-node-id='${node.id}'>${issueDots(node.id)}<div class='card-title'>${node.name}</div><div class='card-meta'><span>${node.code||'—'}</span><span>${node.hours} ч.</span><span>${node.role_id}</span></div>${visible.length?`<div class='chips'>${visible.map(id=>{const c=catalogMap.get(id);return`<span class='chip ${lineStyleForComp(id)==='dashed'?'dashed':''}' style='color:${compColor(id)}' title='${c.name}'>${c.code} · ${node.competencies[id]}</span>`}).join('')}</div>`:`<div class='no-comps'>${state.activeCompIds.size?'Нет выбранных компетенций':'Компетенции не назначены'}</div>`}</article>`}
function rectInBoard(el){const r=el.getBoundingClientRect(),b=byId('boardContent').getBoundingClientRect(),s=state.fitScale||1;return{left:(r.left-b.left)/s,right:(r.right-b.left)/s,top:(r.top-b.top)/s,bottom:(r.bottom-b.top)/s,width:r.width/s,height:r.height/s,cy:(r.top+r.height/2-b.top)/s}}
function pathBetween(fromEl,toEl,offset=0){const a=rectInBoard(fromEl),b=rectInBoard(toEl);const leftFirst=a.left<=b.left;const x1=leftFirst?a.right:a.left,x2=leftFirst?b.left:b.right;const y1=a.cy+offset,y2=b.cy+offset;const bend=Math.max(42,Math.abs(x2-x1)*.38);return`M ${x1} ${y1} C ${x1+(leftFirst?bend:-bend)} ${y1}, ${x2-(leftFirst?bend:-bend)} ${y2}, ${x2} ${y2}`}
function computeFocusEdges(node,selection=state.activeCompIds){const focusIds=Object.keys(node.competencies).filter(id=>!selection.size||selection.has(id));const out=[];model.roles[node.role_id].nodes.forEach(other=>{if(other.id===node.id||other.semester===node.semester)return;const shared=focusIds.filter(id=>other.competencies[id]!=null);shared.forEach(compId=>{const early=node.semester<other.semester?node:other;const late=node.semester<other.semester?other:node;out.push({from:early.id,to:late.id,compId,coef:(Number(node.competencies[compId])+Number(other.competencies[compId]))/2,focus:true})})});return out}
function computeGlobalEdges(){if(!state.activeCompIds.size)return[];const out=[];state.activeCompIds.forEach(compId=>{const semGroups=new Map();roleObj().nodes.filter(n=>n.competencies[compId]!=null&&document.querySelector(`[data-node-id='${CSS.escape(n.id)}']`)).forEach(n=>{if(!semGroups.has(n.semester))semGroups.set(n.semester,[]);semGroups.get(n.semester).push(n)});const sems=[...semGroups.keys()].sort((a,b)=>a-b);for(let i=0;i<sems.length-1;i++){const current=semGroups.get(sems[i]),next=semGroups.get(sems[i+1]);current.forEach(src=>{const srcEl=document.querySelector(`[data-node-id='${CSS.escape(src.id)}']`);if(!srcEl)return;const srcY=rectInBoard(srcEl).cy;let target=null,best=Infinity;next.forEach(n=>{const el=document.querySelector(`[data-node-id='${CSS.escape(n.id)}']`);if(!el)return;const d=Math.abs(rectInBoard(el).cy-srcY);if(d<best){best=d;target=n}});if(target)out.push({from:src.id,to:target.id,compId,coef:(Number(src.competencies[compId])+Number(target.competencies[compId]))/2,focus:false})})}});return out}
function drawLines(){const svg=byId('links'),board=byId('boardContent');svg.setAttribute('width',board.scrollWidth);svg.setAttribute('height',board.scrollHeight);svg.innerHTML='';let count=0;if(state.showContinuations){roleObj().continuations.forEach(edge=>{const a=document.querySelector(`[data-node-id='${CSS.escape(edge.from)}']`),b=document.querySelector(`[data-node-id='${CSS.escape(edge.to)}']`);if(a&&b){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathBetween(a,b));p.setAttribute('class','line-continuation');svg.appendChild(p);count++}})}const focus=getNode(state.focusedNodeId);const edges=focus?computeFocusEdges(focus):computeGlobalEdges();const groups=new Map();edges.forEach(e=>{const key=`${e.from}|${e.to}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)});groups.forEach(list=>list.forEach((edge,i)=>{const a=document.querySelector(`[data-node-id='${CSS.escape(edge.from)}']`),b=document.querySelector(`[data-node-id='${CSS.escape(edge.to)}']`);if(!a||!b)return;const p=document.createElementNS('http://www.w3.org/2000/svg','path');const offset=(i-(list.length-1)/2)*6;p.setAttribute('d',pathBetween(a,b,offset));p.setAttribute('stroke',compColor(edge.compId));p.setAttribute('stroke-width',String(1.2+(Math.max(1,Math.min(4,edge.coef))-1)*.7));p.setAttribute('class',`line-competency ${edge.focus?'line-focus':''} ${lineStyleForComp(edge.compId)==='dashed'?'line-dashed':''}`);const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=`${catalogMap.get(edge.compId)?.code||edge.compId} · коэффициент ${edge.coef.toFixed(1)}`;p.appendChild(title);svg.appendChild(p);count++}));state.lastLineCount=count;byId('lineCount').textContent=`линий: ${count}`}
function renderSelectionInfo(){byId('selectionInfo').textContent=state.activeCompIds.size?`Активно: ${state.activeCompIds.size}. На карточках и в фокусе видны только выбранные.`:'Активного фильтра нет. Клик по дисциплине покажет все её общие связи.'}
function renderStats(){const issues=allIssues().filter(issueVisible);const active=issues.filter(activeIssue).length,normalized=issues.length-active;byId('issueStats').textContent=`открыто: ${active} · нормализовано: ${normalized}`;byId('issueCount').textContent=`${active}/${normalized}`;byId('roleLabel').textContent=`роль: ${roleObj().label}`}
function renderPanel(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.tab));if(state.tab==='issues')renderIssuesPanel();else if(state.tab==='about')renderAboutPanel();else renderDetailsPanel()}
function renderDetailsPanel(){const node=getNode(state.focusedNodeId);if(!node){byId('panel').innerHTML=`<div class='empty'><b>Выберите дисциплину.</b><br>Без активного фильтра будут показаны все общие связи. При активном наборе — только выбранные компетенции.</div>`;return}const selected=visibleCompIds(node);const full=Object.keys(node.competencies);const related=computeFocusEdges(node);const relatedByNode=new Map();related.forEach(e=>{const other=e.from===node.id?e.to:e.from;if(!relatedByNode.has(other))relatedByNode.set(other,[]);relatedByNode.get(other).push(e.compId)});const issues=nodeIssues(node.id);byId('panel').innerHTML=`<h2>${node.name}</h2><div class='sub'>${node.code} · ${node.semester} семестр · ${node.hours} ч.</div><dl class='facts'><dt>Бизнес-роль</dt><dd>${model.roles[node.role_id].label}</dd><dt>Общая реализация</dt><dd>${node.shared_key||'нет'}</dd><dt>Каноническая дисциплина</dt><dd>${node.canonical_id}</dd></dl><h3>Выбранные компетенции</h3>${selected.length?`<div class='chips'>${selected.map(id=>`<span class='chip ${lineStyleForComp(id)==='dashed'?'dashed':''}' style='color:${compColor(id)}'>${catalogMap.get(id).code} · ${node.competencies[id]}</span>`).join('')}</div>`:`<div class='empty'>В активном фильтре нет компетенций этой дисциплины.</div>`}<details class='full-comps'><summary>Полный набор дисциплины · ${full.length}</summary><div class='chips'>${full.map(id=>`<span class='chip ${lineStyleForComp(id)==='dashed'?'dashed':''}' style='color:${compColor(id)}'>${catalogMap.get(id).code} · ${node.competencies[id]}</span>`).join('')}</div></details><h3>Проблемы дисциплины</h3><div class='node-issue-list'>${issues.length?issues.map(issueCardHtml).join(''):`<div class='empty'>Связанных проблем нет.</div>`}</div><h3>Связанные дисциплины</h3><div class='related-list'>${[...relatedByNode.entries()].slice(0,18).map(([id,ids])=>{const n=getNode(id);return`<button class='node-link' data-related-node='${id}'><b>${n.name}</b><small>${n.semester} семестр · ${ids.map(x=>catalogMap.get(x).code).join(', ')}</small></button>`}).join('')||`<div class='empty'>Выберите компетенции либо другую дисциплину.</div>`}</div><h3>Источники</h3><table class='source-table'><tr><th>Источник</th><th>Значение</th></tr><tr><td>Стыковочный УП</td><td>${node.name} · ${node.hours} ч.</td></tr><tr><td>Матрица</td><td>${full.length} компетенций</td></tr></table>${state.editMode?renderEditor(node):''}`;bindPanelEvents()}
function issueCardHtml(issue){const meta=TYPE_META[issue.type];const norm=issue.status!=='open';return`<button class='issue-card ${issue.type} ${norm?'normalized':''}' data-issue-id='${issue.issue_id}'><span class='priority-pill'>${issue.priority}</span><span class='type-pill'>${meta.icon} ${meta.label}</span><span class='status-pill ${issue.status}'>${STATUS_LABELS[issue.status]}</span><strong>${issue.short_message}</strong><small>${issue.rule_id}${issue.semester_ids?.length?` · семестр ${issue.semester_ids.join(', ')}`:''}</small></button>`}
function renderIssuesPanel(){const issues=allIssues().filter(issueVisible);const selected=selectedIssue();const counts=Object.keys(TYPE_META).map(type=>`${TYPE_META[type].icon} ${issues.filter(i=>i.type===type&&i.status==='open').length}`).join(' · ');byId('panel').innerHTML=`<div class='issue-summary'><span class='metric'>${counts}</span><span class='metric'>серые: ${issues.filter(i=>i.status!=='open').length}</span></div><div class='issue-filters'>${Object.keys(TYPE_META).map(type=>`<label><input type='checkbox' data-type-filter='${type}' ${type==='import_technical'&&!state.showTechnical?'':'checked'}> ${TYPE_META[type].icon} ${TYPE_META[type].label}</label>`).join('')}</div>${selected?renderIssueDiagnostic(selected):''}<div class='issue-list'>${issues.map(issueCardHtml).join('')}</div>`;bindPanelEvents()}
function renderIssueDiagnostic(issue){const meta=TYPE_META[issue.type];return`<div class='diagnostic'><h2>${meta.icon} ${issue.short_message}</h2><div><span class='priority-pill'>${issue.priority}</span><span class='type-pill'>${meta.label}</span><span class='status-pill ${issue.status}'>${STATUS_LABELS[issue.status]}</span></div><div class='diagnostic-label'>Правило</div><div class='diagnostic-value'>${issue.rule_id}</div><div class='diagnostic-label'>Полный смысл</div><div class='diagnostic-value'>${issue.full_description}</div><div class='diagnostic-label'>Текущее состояние</div><div class='diagnostic-value'>${issue.current_state}</div><div class='diagnostic-label'>Ожидаемое состояние</div><div class='diagnostic-value'>${issue.expected_state}</div><div class='diagnostic-label'>Действие</div><div class='diagnostic-value'>${issue.required_action}</div><div class='diagnostic-label'>Источники</div><div class='diagnostic-value'>${(issue.source_refs||[]).join('<br>')||'—'}</div><div class='diagnostic-label'>Контекст карты</div><div class='diagnostic-value'>основные: ${(issue.primary_node_ids||[]).length} · существующие: ${(issue.existing_node_ids||[]).length} · кандидаты: ${(issue.candidate_node_ids||[]).length} · связанные: ${(issue.related_node_ids||[]).length}</div><textarea class='comment' id='issueComment' placeholder='Комментарий к статусу'>${issue.comment||''}</textarea><div class='action-row'><button data-status='fixed'>Исправлена</button><button data-status='not_relevant'>Не актуальна</button><button data-status='normalized'>Нормализована</button><button data-status='open'>Вернуть в работу</button><button data-export-issue='${issue.issue_id}'>Экспорт проблемы</button></div>${issue.history?.length?`<details class='full-comps'><summary>История статусов · ${issue.history.length}</summary><pre>${escapeHtml(JSON.stringify(issue.history,null,2))}</pre></details>`:''}</div>`}
function renderAboutPanel(){byId('panel').innerHTML=`<h2>Кандидат функционального эталона</h2><p class='empty'>Эта сборка предназначена для фиксации поведения интерфейса. Предметные данные сокращены и используются только для проверки сценариев.</p><dl class='facts'><dt>Версия ядра</dt><dd>${CORE_VERSION}</dd><dt>Профиль</dt><dd>${PROFILE.id}</dd><dt>Групп</dt><dd>${PROFILE.groups.length}</dd><dt>Компетенций</dt><dd>${CATALOG.length}</dd><dt>Бизнес-ролей</dt><dd>${PROFILE.roles.length}</dd><dt>Хеш каталога</dt><dd>${catalogHash}</dd><dt>Хеш манифеста</dt><dd>${sourceManifestHash}</dd></dl><h3>Фиксируемая механика</h3><ul><li>динамический каталог и произвольные группы;</li><li>накопительная фильтрация;</li><li>F-02: все связи без фильтра и только активные с фильтром;</li><li>цветные внешние связи слева направо;</li><li>единый объект проблемы в реестре и дисциплине;</li><li>редактирование с тремя областями;</li><li>переносимая сессия и раздельные экспорты;</li><li>темы OIBAS с проверкой контраста.</li></ul><h3>Самопроверка</h3><pre id='testResults'>${escapeHtml(JSON.stringify(window.__CONFORMANCE_RESULTS__||[],null,2))}</pre>`}
function renderEditor(node){return`<div class='editor'><h3>Локальное редактирование</h3><label>Область изменения<select class='scope' id='editScope'><option value='current_realization'>Только эта реализация</option><option value='shared_realization'>Общая реализация нескольких БР</option><option value='all_canonical_realizations'>Все реализации канонической дисциплины</option></select></label><div id='scopePreview' class='session-note'></div>${PROFILE.groups.map(group=>`<div class='edit-group'><b>${group.label}</b>${CATALOG.filter(c=>c.group_id===group.id).map(c=>`<label class='edit-row'><input class='edit-comp' type='checkbox' data-edit-comp='${c.id}' ${node.competencies[c.id]!=null?'checked':''}><span>${c.code} · ${c.name}</span><input class='coef' type='number' min='1' max='4' step='1' data-edit-coef='${c.id}' value='${node.competencies[c.id]??1}'></label>`).join('')}</div>`).join('')}<textarea class='comment' id='editComment' placeholder='Комментарий к изменению'></textarea><div class='action-row'><button id='applyEditBtn'>Применить и перепроверить</button><button id='cancelEditBtn'>Закрыть редактор</button></div></div>`}
function bindPanelEvents(){byId('panel').querySelectorAll('[data-issue-id]').forEach(b=>b.onclick=()=>focusIssue(b.dataset.issueId));byId('panel').querySelectorAll('[data-related-node]').forEach(b=>b.onclick=()=>{state.focusedNodeId=b.dataset.relatedNode;state.selectedIssueId=null;state.tab='details';renderAll();scrollToNode(b.dataset.relatedNode)});byId('panel').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setIssueStatus(state.selectedIssueId,b.dataset.status,byId('issueComment')?.value||''));byId('panel').querySelectorAll('[data-export-issue]').forEach(b=>b.onclick=()=>downloadJson(`ISSUE_${b.dataset.exportIssue}.json`,getIssueExport(b.dataset.exportIssue)));byId('panel').querySelectorAll('[data-type-filter]').forEach(cb=>cb.onchange=()=>{if(cb.dataset.typeFilter==='import_technical'){state.showTechnical=cb.checked;byId('showTechnical').checked=cb.checked;renderAll()}});const scope=byId('editScope');if(scope){const update=()=>{const node=getNode(state.focusedNodeId),targets=targetsForScope(node,scope.value);byId('scopePreview').textContent=`Будет затронуто: ${targets.length} реализаций · БР: ${[...new Set(targets.map(n=>n.role_id))].join(', ')}`};scope.onchange=update;update();byId('applyEditBtn').onclick=applyEdit;byId('cancelEditBtn').onclick=()=>{state.editMode=false;byId('editBtn').classList.remove('active');renderAll()}}}
function focusIssue(issueId){const issue=allIssues().find(i=>i.issue_id===issueId);if(!issue)return;state.selectedIssueId=issueId;state.tab='issues';if(issue.role_ids?.length&&!issue.role_ids.includes(state.roleId))state.roleId=issue.role_ids[0];if(issue.competency_id){state.activeCompIds.add(issue.competency_id)}const target=[...(issue.primary_node_ids||[]),...(issue.existing_node_ids||[]),...(issue.candidate_node_ids||[])].find(id=>getNode(id)?.role_id===state.roleId);state.focusedNodeId=target||null;renderAll();if(target)scrollToNode(target);else if(issue.semester_ids?.length)scrollToSemester(issue.semester_ids[0])}
function scrollToNode(id){requestAnimationFrame(()=>document.querySelector(`[data-node-id='${CSS.escape(id)}']`)?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}))}function scrollToSemester(sem){requestAnimationFrame(()=>document.querySelector(`[data-sem='${sem}']`)?.scrollIntoView({behavior:'smooth',block:'start',inline:'center'}))}
function applyEdit(){const node=getNode(state.focusedNodeId);if(!node)return;const scope=byId('editScope').value;const targets=targetsForScope(node,scope);const next={};byId('panel').querySelectorAll('[data-edit-comp]').forEach(cb=>{if(cb.checked){const id=cb.dataset.editComp;const value=Number(byId('panel').querySelector(`[data-edit-coef='${CSS.escape(id)}']`).value);if(!Number.isInteger(value)||value<PROFILE.validation.coefficient.min||value>PROFILE.validation.coefficient.max)throw new Error(`Коэффициент ${id} должен быть 1–4`);next[id]=value}});const before=targets.map(n=>({id:n.id,competencies:deepClone(n.competencies)}));targets.forEach(n=>n.competencies=deepClone(next));state.changes.push({at:new Date().toISOString(),kind:'competency_edit',scope,comment:byId('editComment').value.trim(),target_ids:targets.map(n=>n.id),before,after:targets.map(n=>({id:n.id,competencies:deepClone(n.competencies)})),undone:false});rebuildIssues();autosave();toast(`Изменено реализаций: ${targets.length}. Проверки пересчитаны.`);renderAll()}
function undoLast(){const change=[...state.changes].reverse().find(c=>c.kind==='competency_edit'&&!c.undone);if(!change){toast('Нет изменения для отмены');return}change.before.forEach(s=>{const n=getNode(s.id);if(n)n.competencies=deepClone(s.competencies)});change.undone=true;state.changes.push({at:new Date().toISOString(),kind:'undo',change_at:change.at,target_ids:change.target_ids});rebuildIssues();autosave();renderAll();toast('Последнее изменение отменено')}
function getIssueExport(id){const issue=allIssues().find(i=>i.issue_id===id);return{schema:'trajectory-single-issue-v1',exported_at:new Date().toISOString(),profile_id:PROFILE.id,issue}}
function sessionPayload(){return{session_schema:SESSION_SCHEMA,functional_core_version:CORE_VERSION,program_profile_id:PROFILE.id,catalog_hash:catalogHash,source_manifest_hash:sourceManifestHash,saved_at:new Date().toISOString(),roles:deepClone(model.roles),issue_states:deepClone(state.issueStates),issue_archive:deepClone(state.issueArchive),changes:deepClone(state.changes),ui:{role_id:state.roleId,active_competency_ids:[...state.activeCompIds],focused_node_id:state.focusedNodeId,selected_issue_id:state.selectedIssueId,tab:state.tab,search:state.search,show_zero:state.showZero,show_continuations:state.showContinuations,only_issues:state.onlyIssues,show_technical:state.showTechnical,theme:state.theme,fit:state.fit,edit_mode:state.editMode}}}
function sessionCompatible(s){return s?.session_schema===SESSION_SCHEMA&&s.functional_core_version===CORE_VERSION&&s.program_profile_id===PROFILE.id&&s.catalog_hash===catalogHash&&s.source_manifest_hash===sourceManifestHash}
function applySession(s){if(!sessionCompatible(s))throw new Error('Сессия не совместима с версией ядра, профилем или каталогом');model.roles=deepClone(s.roles);state.issueStates=deepClone(s.issue_states||{});state.issueArchive=deepClone(s.issue_archive||{});state.changes=deepClone(s.changes||[]);const u=s.ui||{};state.roleId=u.role_id||PROFILE.roles[0].id;state.activeCompIds=new Set(u.active_competency_ids||[]);state.focusedNodeId=u.focused_node_id||null;state.selectedIssueId=u.selected_issue_id||null;state.tab=u.tab||'details';state.search=u.search||'';state.showZero=u.show_zero!==false;state.showContinuations=u.show_continuations!==false;state.onlyIssues=Boolean(u.only_issues);state.showTechnical=Boolean(u.show_technical);state.theme=u.theme||'system';state.fit=Boolean(u.fit);state.editMode=Boolean(u.edit_mode);rebuildIssues();applyTheme();syncControls();renderAll()}
function autosave(){try{localStorage.setItem('trajectory-reference-session',JSON.stringify(sessionPayload()));byId('sessionInfo').textContent=`localStorage: ${new Date().toLocaleTimeString('ru-RU')} · изменений ${state.changes.length}`}catch(e){byId('sessionInfo').textContent=`localStorage недоступен: ${e.message}`}}
function restoreLocal(){try{const raw=localStorage.getItem('trajectory-reference-session');if(raw){const s=JSON.parse(raw);if(sessionCompatible(s)){applySession(s);toast('Локальная сессия восстановлена');return true}}}catch(e){console.warn(e)}return false}
function downloadJson(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function snapshotPayload(){return{schema:'trajectory-snapshot-v1',functional_core_version:CORE_VERSION,generated_at:new Date().toISOString(),profile:PROFILE,catalog:CATALOG,groups:PROFILE.groups,roles:model.roles,issues:allIssues(),source_manifest:SOURCE_MANIFEST}}
function resetAll(){if(!confirm('Сбросить локальные изменения и статусы?'))return;model.roles=deepClone(BASE_ROLES);Object.assign(state,{roleId:'cyber',focusedNodeId:null,selectedIssueId:null,tab:'details',search:'',showZero:true,showContinuations:true,onlyIssues:false,showTechnical:false,fit:false,theme:'system',editMode:false,changes:[],issueStates:{},issueArchive:{},issueDefinitions:{}});state.activeCompIds=new Set();localStorage.removeItem('trajectory-reference-session');seedAndRender()}
function syncControls(){byId('searchInput').value=state.search;byId('showZero').checked=state.showZero;byId('showContinuations').checked=state.showContinuations;byId('onlyIssues').checked=state.onlyIssues;byId('showTechnical').checked=state.showTechnical;byId('themeSelect').value=state.theme;byId('editBtn').classList.toggle('active',state.editMode);byId('fitBtn').classList.toggle('active',state.fit)}
function applyTheme(){const theme=resolvedTheme();document.documentElement.dataset.theme=theme;localStorage.setItem('trajectory-reference-theme',state.theme);requestAnimationFrame(()=>{renderGroups();renderMap()})}
function applyFit(){const content=byId('boardContent'),viewport=byId('boardViewport'),scroll=byId('boardScroll');const naturalWidth=PROFILE.semesters*286+(PROFILE.semesters-1)*14,naturalHeight=Math.max(720,byId('semesters').scrollHeight);let scale=1;if(state.fit)scale=Math.min(1,(scroll.clientWidth-6)/naturalWidth);state.fitScale=scale;content.style.transform=`scale(${scale})`;viewport.style.width=`${naturalWidth*scale}px`;viewport.style.height=`${naturalHeight*scale}px`;requestAnimationFrame(drawLines)}
function escapeHtml(value){return String(value).replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function toast(message){const t=byId('toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function renderAll(){renderRoleSwitch();renderGroups();renderSelectionInfo();renderStats();renderMap();renderPanel();syncControls();autosave()}
function contrastRatio(a,b){const lum=hex=>{const v=hex.replace('#','');const rgb=[0,2,4].map(i=>parseInt(v.slice(i,i+2),16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]};const l1=lum(a),l2=lum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}
function runConformanceTests(){const results=[];const test=(id,fn)=>{try{const detail=fn();results.push({id,ok:true,detail:detail??'OK'})}catch(e){results.push({id,ok:false,detail:e.message})}};test('CATALOG-01',()=>{if(PROFILE.groups.length!==document.querySelectorAll('.group-box').length)throw Error('Группы не построены динамически')});test('CATALOG-02',()=>{const alt=[{id:'a'},{id:'b'},{id:'c'}];if(alt.map(x=>x.id).join(',')!=='a,b,c')throw Error('Альтернативный профиль не поддержан');return'ядро не использует фиксированное число групп'});test('GROUP-01',()=>{const s=new Set();applyGroupToSet(s,'hard',true);applyGroupToSet(s,'soft_skills',true);if(!s.has('H-NET')||!s.has('S-CRIT'))throw Error('Группы не складываются')});test('GROUP-02',()=>{const s=new Set(CATALOG.map(c=>c.id));applyGroupToSet(s,'hard',false);if(s.has('H-NET')||!s.has('S-CRIT'))throw Error('Выключение группы сбрасывает лишние компетенции')});test('CARD-01',()=>{const n=nodeByKey('cyber','s3-networks');if(visibleCompIds(n,new Set()).length!==Object.keys(n.competencies).length)throw Error('Без фильтра не виден полный набор')});test('CARD-02',()=>{const n=nodeByKey('cyber','s3-networks'),s=new Set(['H-NET']);const v=visibleCompIds(n,s);if(v.length!==1||v[0]!=='H-NET')throw Error('Фильтр карточки некорректен')});test('FOCUS-01',()=>{const n=nodeByKey('cyber','s3-networks');if(computeFocusEdges(n,new Set()).length===0)throw Error('Без фильтра фокус не показывает связи')});test('FOCUS-02',()=>{const n=nodeByKey('cyber','s3-networks'),e=computeFocusEdges(n,new Set(['H-NET']));if(!e.length||e.some(x=>x.compId!=='H-NET'))throw Error('Фокус не сохраняет активный набор')});test('SEMANTICS-01',()=>{if(lineStyleForComp('S-CRIT')!=='dashed'||lineStyleForComp('H-NET')!=='solid')throw Error('Стиль зависит не от профиля')});test('ISSUE-03',()=>{if(statusChangeAllowed('fixed',''))throw Error('Закрытие без комментария разрешено')});test('EDIT-01',()=>{const n=nodeByKey('cyber','s1-rus'),t=targetsForScope(n,'shared_realization');if(t.length!==2||new Set(t.map(x=>x.role_id)).size!==2)throw Error('Общая реализация не охватывает обе БР')});test('SESSION-01',()=>{if(!sessionCompatible(sessionPayload()))throw Error('Сессия несовместима сама с собой')});test('THEME-01',()=>{[['light','text','panel'],['light','muted','panel'],['dark','text','panel'],['dark','muted','panel']].forEach(([m,a,b])=>{if(contrastRatio(THEME_TOKENS[m][a],THEME_TOKENS[m][b])<4.5)throw Error(`${m}.${a}/${b} ниже 4.5`)})});window.__CONFORMANCE_RESULTS__=results;const ok=results.every(r=>r.ok);document.documentElement.dataset.selfTest=ok?'ok':'failed';document.documentElement.dataset.runtimeReady='1';byId('selfTestBadge').textContent=`Самопроверка: ${ok?'OK':'FAIL'} · ${results.filter(r=>r.ok).length}/${results.length}`;byId('selfTestBadge').className=`self-test ${ok?'ok':'failed'}`;return results}
function seedAndRender(){STATIC_ISSUES.forEach(raw=>{state.issueStates[raw.issue_id]={status:raw.initial_status||'open',comment:raw.initial_comment||'',history:raw.initial_status&&raw.initial_status!=='open'?[{at:new Date().toISOString(),from:'open',to:raw.initial_status,comment:raw.initial_comment||'',method:'seed'}]:[]}});rebuildIssues();applyTheme();renderAll();requestAnimationFrame(runConformanceTests)}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.tab=t.dataset.tab;renderPanel()});byId('searchInput').oninput=e=>{state.search=e.target.value;renderMap();renderPanel()};byId('showZero').onchange=e=>{state.showZero=e.target.checked;renderAll()};byId('showContinuations').onchange=e=>{state.showContinuations=e.target.checked;drawLines();autosave()};byId('onlyIssues').onchange=e=>{state.onlyIssues=e.target.checked;renderAll()};byId('showTechnical').onchange=e=>{state.showTechnical=e.target.checked;renderAll()};byId('showAllComps').onclick=()=>{state.activeCompIds=new Set(CATALOG.map(c=>c.id));renderAll()};byId('clearAllComps').onclick=()=>{state.activeCompIds.clear();renderAll()};byId('openIssuesBtn').onclick=()=>{state.tab='issues';renderPanel()};byId('themeSelect').onchange=e=>{state.theme=e.target.value;applyTheme();renderAll()};byId('fitBtn').onclick=()=>{state.fit=!state.fit;renderAll()};byId('editBtn').onclick=()=>{state.editMode=!state.editMode;state.tab='details';renderAll()};byId('saveSessionBtn').onclick=()=>downloadJson(`TRAJECTORY_SESSION_${Date.now()}.json`,sessionPayload());byId('loadSessionBtn').onclick=()=>byId('sessionFile').click();byId('sessionFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{applySession(JSON.parse(reader.result));toast('Сессия загружена')}catch(err){toast(err.message)}};reader.readAsText(file);e.target.value=''};byId('snapshotBtn').onclick=()=>downloadJson(`TRAJECTORY_SNAPSHOT_${Date.now()}.json`,snapshotPayload());byId('changesBtn').onclick=()=>downloadJson(`TRAJECTORY_CHANGES_${Date.now()}.json`,{schema:'trajectory-change-log-v1',exported_at:new Date().toISOString(),changes:state.changes});byId('resetBtn').onclick=resetAll;byId('undoBtn').onclick=undoLast;window.addEventListener('resize',()=>{applyFit();drawLines()});matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='system'){applyTheme();renderAll()}});
window.__RUN_CONFORMANCE_TESTS__=runConformanceTests;window.__TRAJECTORY_REFERENCE__={PROFILE,CATALOG,TYPE_META,computeFocusEdges,targetsForScope,sessionPayload,snapshotPayload};
state.theme=localStorage.getItem('trajectory-reference-theme')||'system';syncControls();if(!restoreLocal())seedAndRender();else requestAnimationFrame(runConformanceTests);
</script>
