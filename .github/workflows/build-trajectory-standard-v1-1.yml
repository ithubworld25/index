name: build-trajectory-standard-v1-1
on:
  push:
    branches:
      - trajectory-standard-v1.1
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified RC2 source package
        run: |
          set -euo pipefail
          python3 reference_candidate_rc2/patch_builder.py
          python3 reference_candidate_rc2/build_rc2.py

      - name: Build functional reference v1.0 and standard v1.1
        run: |
          set -euo pipefail
          python3 standard_v1_1/patch_build.py
          python3 standard_v1_1/build_system.py
          unzip -t build_standard_v1_1/TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.zip
          unzip -t build_standard_v1_1/STANDARD_TRAJECTORY_VISUALIZATION_v1.1.zip
          unzip -t build_standard_v1_1/TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.zip

      - name: Publish stable release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='trajectory-visualization-system-v1.1'
          TITLE='Trajectory Visualization System v1.1'
          ASSETS=(
            build_standard_v1_1/TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.zip
            build_standard_v1_1/STANDARD_TRAJECTORY_VISUALIZATION_v1.1.zip
            build_standard_v1_1/TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.zip
            build_standard_v1_1/PACKAGE_SHA256_v1.1.txt
            build_standard_v1_1/BUILD_RESULT.json
            build_standard_v1_1/standard_v1_1/01_STANDARD_SPEC_v1.1.json
            build_standard_v1_1/standard_v1_1/02_FULL_GENERATION_PROMPT_RU_v1.1.md
            build_standard_v1_1/standard_v1_1/03_SHORT_LAUNCH_PROMPT_RU_v1.1.txt
            build_standard_v1_1/standard_v1_1/10_THEME_AND_CONTRAST_v1.1.json
            build_standard_v1_1/standard_v1_1/11_FINAL_PACKAGE_CONTRACT_v1.1.json
            build_standard_v1_1/standard_v1_1/18_FUNCTIONAL_CORE_MANIFEST_v1.0.json
            build_standard_v1_1/standard_v1_1/FUNCTIONAL_CORE_TEMPLATE_v1.0.html
            build_standard_v1_1/standard_v1_1/VERIFICATION_REPORT_v1.1.md
            build_standard_v1_1/standard_v1_1/AUTOTEST_RESULTS_v1.1.json
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            for file in "${ASSETS[@]}"; do
              name="$(basename "$file")"
              gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "${ASSETS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes 'Зафиксированное функциональное ядро v1.0, стандарт генерации v1.1, полный и короткий промпты, контракты и отчёт автоматической проверки.'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TRAJECTORY_VISUALIZATION_SYSTEM_v1.1
          path: |
            build_standard_v1_1/TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.zip
            build_standard_v1_1/STANDARD_TRAJECTORY_VISUALIZATION_v1.1.zip
            build_standard_v1_1/TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.zip
            build_standard_v1_1/PACKAGE_SHA256_v1.1.txt
            build_standard_v1_1/BUILD_RESULT.json
            build_standard_v1_1/standard_v1_1/01_STANDARD_SPEC_v1.1.json
            build_standard_v1_1/standard_v1_1/02_FULL_GENERATION_PROMPT_RU_v1.1.md
            build_standard_v1_1/standard_v1_1/03_SHORT_LAUNCH_PROMPT_RU_v1.1.txt
            build_standard_v1_1/standard_v1_1/10_THEME_AND_CONTRAST_v1.1.json
            build_standard_v1_1/standard_v1_1/11_FINAL_PACKAGE_CONTRACT_v1.1.json
            build_standard_v1_1/standard_v1_1/18_FUNCTIONAL_CORE_MANIFEST_v1.0.json
            build_standard_v1_1/standard_v1_1/FUNCTIONAL_CORE_TEMPLATE_v1.0.html
            build_standard_v1_1/standard_v1_1/VERIFICATION_REPORT_v1.1.md
            build_standard_v1_1/standard_v1_1/AUTOTEST_RESULTS_v1.1.json
          retention-days: 14
          compression-level: 0
