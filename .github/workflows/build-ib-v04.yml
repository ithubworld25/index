name: build-ib-v04

on:
  push:
    branches:
      - tmp-build-ib-v04-20260812

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Apply v0.4 patch and build autonomous package
        shell: bash
        run: |
          set -euo pipefail
          python3 build/patch_v04.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/build.py')
          s = p.read_text(encoding='utf-8')
          old = 'forbidden = ["<script src=", "fetch(", "http://", "https://"]'
          new = 'forbidden = ["<script src=", "fetch("]'
          if old not in s:
              raise SystemExit('Expected static-check declaration not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python3 build/build.py | tee build/build_result.json

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          timeout 45s google-chrome --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --virtual-time-budget=6000 --dump-dom "file://${GITHUB_WORKSPACE}/package/START.html" > build/rendered_dom.html
          grep -q 'data-runtime-ready="1"' build/rendered_dom.html
          grep -q 'data-self-test="ok"' build/rendered_dom.html
          grep -q 'data-v04-self-test="ok"' build/rendered_dom.html
          grep -q 'Самопроверка: OK' build/rendered_dom.html
          grep -q 'Сохранить сессию' build/rendered_dom.html
          grep -q 'Загрузить сессию' build/rendered_dom.html
          grep -q 'Тёмная тема' build/rendered_dom.html
          grep -q 'Нормализованные' build/rendered_dom.html

      - name: Verify v0.4 package contour
        shell: bash
        run: |
          set -euo pipefail
          test -s package/START.html
          test -s package/НОРМАЛИЗОВАННЫЕ_ДАННЫЕ.json
          test -s package/РЕЕСТР_ОШИБОК.json
          test -s package/ПРОТОКОЛ_ПРОВЕРКИ.txt
          ! grep -q '<script src=' package/START.html
          ! grep -q 'fetch(' package/START.html
          grep -q 'activeCompIndices' package/START.html
          grep -q 'setErrorStatus' package/START.html
          grep -q 'saveWorkingSession' package/START.html
          grep -q 'restoreLocalSession' package/START.html
          grep -q 'theme-dark' package/START.html
          grep -q 'issue-count normalized' package/START.html
          find package -maxdepth 1 -type f -printf '%f\n' | sort | tee build/package_files.txt
          sha256sum package/* | sort | tee build/package_sha256.txt
          python3 - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          data=json.loads(Path('package/НОРМАЛИЗОВАННЫЕ_ДАННЫЕ.json').read_text(encoding='utf-8'))
          assert data['meta']['version'] == 'v0.4'
          assert len(data['catalog']) == 43
          assert set(data['roles']) == {'kiber','devops'}
          assert all(set(n['semester'] for n in data['roles'][r]['nodes']) == set(range(1,9)) for r in data['roles'])
          assert data['groups']['soft']['indices'] == [13,14,15,16,17]
          assert any(e['rule']=='SOFT_DEFICIT' for e in data['initial_errors'])
          assert any(e['rule']=='HARD_MISSING' for e in data['initial_errors'])
          html=Path('package/START.html').read_text(encoding='utf-8')
          assert 'v0.4' in html
          assert 'Исправлена' in html and 'Не актуальна' in html
          assert 'Системная тема' in html and 'Тёмная тема' in html
          assert 'рабочая_сессия_траектории_ИБ_v0.4.json' in html
          zpath=Path('build/final_integrity.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('package').iterdir():
                  if p.is_file(): z.write(p,p.name)
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              assert 'START.html' in z.namelist()
              assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
          print(json.dumps({
              'version':data['meta']['version'],
              'catalog':len(data['catalog']),
              'kiber_nodes':len(data['roles']['kiber']['nodes']),
              'devops_nodes':len(data['roles']['devops']['nodes']),
              'errors':len(data['initial_errors']),
              'zip_size':zpath.stat().st_size
          },ensure_ascii=False))
          PY

      - name: Upload verified v0.4 package
        uses: actions/upload-artifact@v4
        with:
          name: IB_TRAJECTORY_V04
          path: package/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
