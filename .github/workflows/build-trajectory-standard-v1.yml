name: build-trajectory-standard-v1
on:
  push:
    branches:
      - tmp-build-trajectory-standard-v1-20260813
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout standard branch
        uses: actions/checkout@v4

      - name: Validate and package standard
        run: |
          set -euo pipefail
          python3 standard/validate_standard.py | tee standard/_build/validation_result.json

      - name: Browser smoke tests
        run: |
          set -euo pipefail
          google-chrome --version
          timeout 45s google-chrome --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --virtual-time-budget=4000 --dump-dom "file://${GITHUB_WORKSPACE}/standard_package/reference/UI_REFERENCE_SHELL.html" > standard/_build/light_dom.html
          grep -q 'data-runtime-ready="1"' standard/_build/light_dom.html
          grep -q 'data-self-test="ok"' standard/_build/light_dom.html
          grep -q 'data-theme="light"' standard/_build/light_dom.html
          python3 - <<'PY'
          from pathlib import Path
          source=Path('standard_package/reference/UI_REFERENCE_SHELL.html').read_text(encoding='utf-8')
          dark=source.replace('data-theme="light"','data-theme="dark"',1).replace("||'light'","||'dark'",1)
          Path('standard/_build/dark_reference.html').write_text(dark,encoding='utf-8')
          marker="window.__RUN_SELF_TEST__=selfTest;document.addEventListener('DOMContentLoaded',selfTest);"
          replacement="window.__RUN_SELF_TEST__=selfTest;document.addEventListener('DOMContentLoaded',()=>{showGroup('soft');selfTest();setTimeout(()=>{const hidden=[...document.querySelectorAll('.chip')].filter(x=>x.dataset.group!=='soft').every(x=>x.hidden);const dim=Boolean(document.querySelector('.card[data-groups=\"pk\"]')?.classList.contains('dim'));document.documentElement.dataset.filterTest=(hidden&&dim)?'ok':'failed'},0)});"
          if marker not in source:
              raise SystemExit('Filter-test injection marker not found')
          Path('standard/_build/filter_reference.html').write_text(source.replace(marker,replacement),encoding='utf-8')
          PY
          timeout 45s google-chrome --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --virtual-time-budget=4000 --dump-dom "file://${GITHUB_WORKSPACE}/standard/_build/dark_reference.html" > standard/_build/dark_dom.html
          grep -q 'data-runtime-ready="1"' standard/_build/dark_dom.html
          grep -q 'data-self-test="ok"' standard/_build/dark_dom.html
          grep -q 'data-theme="dark"' standard/_build/dark_dom.html
          timeout 45s google-chrome --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --virtual-time-budget=4000 --dump-dom "file://${GITHUB_WORKSPACE}/standard/_build/filter_reference.html" > standard/_build/filter_dom.html
          grep -q 'data-filter-test="ok"' standard/_build/filter_dom.html
          cat >> standard_package/VERIFICATION_PROTOCOL.txt <<'EOF'
          PASS: Chrome light-theme smoke test
          PASS: Chrome dark-theme smoke test
          PASS: group-selection and card-dimming smoke test
          EOF

      - name: Refresh manifest and verify final ZIP contour
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          package=Path('standard_package')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          manifest=json.loads((package/'00_MANIFEST.json').read_text(encoding='utf-8'))
          manifest['files']=[]
          for path in sorted((p for p in package.rglob('*') if p.is_file() and p.name!='00_MANIFEST.json'),key=lambda p:str(p.relative_to(package))):
              manifest['files'].append({'name':str(path.relative_to(package)).replace('\\','/'),'size':path.stat().st_size,'sha256':sha(path)})
          (package/'00_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          zpath=Path('standard/_build/STANDARD_TRAJECTORY_VISUALIZATION_v1.0.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in sorted((p for p in package.rglob('*') if p.is_file()),key=lambda p:str(p.relative_to(package))):
                  z.write(path,str(path.relative_to(package)).replace('\\','/'))
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert 'README.md' in names
              assert '03_SHORT_LAUNCH_PROMPT_RU.txt' in names
              assert 'reference/UI_REFERENCE_SHELL.html' in names
              assert all(not n.startswith('/') and '..' not in Path(n).parts for n in names)
          digest=sha(zpath)
          (package/'PACKAGE_SHA256.txt').write_text(f'{digest}  STANDARD_TRAJECTORY_VISUALIZATION_v1.0.zip\n',encoding='utf-8')
          print(json.dumps({'zip_size':zpath.stat().st_size,'zip_sha256':digest,'files':len(names)},ensure_ascii=False))
          PY
          test -s standard_package/README.md
          test -s standard_package/00_MANIFEST.json
          test -s standard_package/02_FULL_GENERATION_PROMPT_RU.md
          test -s standard_package/03_SHORT_LAUNCH_PROMPT_RU.txt
          test -s standard_package/10_CONTRAST_TEST_RESULTS.json
          test -s standard_package/VERIFICATION_PROTOCOL.txt
          ! grep -q '<script src=' standard_package/reference/UI_REFERENCE_SHELL.html
          ! grep -q 'fetch(' standard_package/reference/UI_REFERENCE_SHELL.html
          find standard_package -type f -printf '%P\n' | sort

      - name: Upload verified standard package
        uses: actions/upload-artifact@v4
        with:
          name: STANDARD_TRAJECTORY_VISUALIZATION_V1
          path: standard_package/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
