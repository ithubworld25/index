name: build-functional-reference-rc1
on:
  push:
    branches:
      - trajectory-functional-reference-v0.9-rc1
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build validate and package candidate
        run: python3 reference_candidate/build_rc1.py
      - name: Publish stable prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='trajectory-functional-reference-v0.9-rc1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build_rc1/TRAJECTORY_FUNCTIONAL_REFERENCE_v0.9-rc1.zip build_rc1/PACKAGE_SHA256.txt --clobber
          else
            gh release create "$TAG" build_rc1/TRAJECTORY_FUNCTIONAL_REFERENCE_v0.9-rc1.zip build_rc1/PACKAGE_SHA256.txt \
              --target "${GITHUB_SHA}" \
              --title 'TRAJECTORY_FUNCTIONAL_REFERENCE v0.9-rc1' \
              --notes 'Кандидат функционального эталона для командной приёмки. Не является зафиксированной версией v1.0.' \
              --prerelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TRAJECTORY_FUNCTIONAL_REFERENCE_v0.9-rc1
          path: |
            build_rc1/TRAJECTORY_FUNCTIONAL_REFERENCE_v0.9-rc1.zip
            build_rc1/PACKAGE_SHA256.txt
          retention-days: 14
          compression-level: 0
