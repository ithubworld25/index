name: build-acceptance-doc
on:
  push:
    branches:
      - trajectory-functional-reference-acceptance-doc-v0.9-rc1
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install DOCX dependency
        run: python3 -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Build and validate Word protocol
        run: |
          set -euo pipefail
          mkdir -p acceptance_doc/out
          python3 acceptance_doc/build_docx.py | tee acceptance_doc/out/BUILD_RESULT.txt
          test -s acceptance_doc/out/PROTOKOL_PRIEMKI_TRAJECTORY_REFERENCE_v0.9-rc1.docx
          test -s acceptance_doc/out/PROTOKOL_SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('acceptance_doc/out/PROTOKOL_PRIEMKI_TRAJECTORY_REFERENCE_v0.9-rc1.docx')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'word/document.xml' in z.namelist()
          print({'docx_size':p.stat().st_size,'zip_integrity':'PASS'})
          PY
      - name: Publish stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='trajectory-functional-reference-v0.9-rc1'
          gh release upload "$TAG" \
            acceptance_doc/out/PROTOKOL_PRIEMKI_TRAJECTORY_REFERENCE_v0.9-rc1.docx \
            acceptance_doc/out/PROTOKOL_SHA256.txt \
            --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: PROTOKOL_PRIEMKI_TRAJECTORY_REFERENCE_v0.9-rc1
          path: |
            acceptance_doc/out/PROTOKOL_PRIEMKI_TRAJECTORY_REFERENCE_v0.9-rc1.docx
            acceptance_doc/out/PROTOKOL_SHA256.txt
            acceptance_doc/out/BUILD_RESULT.txt
          retention-days: 14
          compression-level: 0
