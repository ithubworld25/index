name: build-trajectory-standard-v1-1-1
on:
  push:
    branches:
      - trajectory-standard-v1.1.1
    paths-ignore:
      - standard_v1_1_1/LAST_BUILD.json
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified RC2 source package
        run: |
          set -euo pipefail
          python3 reference_candidate_rc2/patch_builder.py
          python3 reference_candidate_rc2/build_rc2.py

      - name: Prepare v1.1.1 hotfix sources
        run: |
          set -euo pipefail
          python3 standard_v1_1_1/prepare_hotfix.py
          cp standard_v1_1/core_tools.py standard_v1_1_1/core_tools.py
          python3 -m py_compile standard_v1_1_1/prepare_hotfix.py standard_v1_1_1/build_system.py standard_v1_1_1/core_tools.py

      - name: Build functional core v1.0.1 and standard v1.1.1
        run: |
          set -euo pipefail
          python3 standard_v1_1_1/build_system.py
          unzip -t build_standard_v1_1_1/TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.1.zip
          unzip -t build_standard_v1_1_1/STANDARD_TRAJECTORY_VISUALIZATION_v1.1.1.zip
          unzip -t build_standard_v1_1_1/TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.1.zip
          python3 build_standard_v1_1_1/standard_v1_1_1/verify_functional_core.py \
            build_standard_v1_1_1/standard_v1_1_1/FUNCTIONAL_CORE_TEMPLATE_v1.0.1.html \
            build_standard_v1_1_1/standard_v1_1_1/18_FUNCTIONAL_CORE_MANIFEST_v1.0.1.json

      - name: Add P0 resolution report
        run: |
          set -euo pipefail
          cat > build_standard_v1_1_1/P0_CORE_01_RESOLUTION.md <<'EOF'
          # Решение P0-CORE-01

          Выпущено функциональное ядро 1.0.1 и стандарт 1.1.1.

          Исправления:

          - тёмная тема: активный текст `#0F172A` на фоне `#60A5FA`;
          - светлая тема: border `#7C899D`;
          - добавлены проверки вычисленных браузером стилей активных элементов;
          - добавлены проверки border на `panel`, `panel_alt` и `bg`;
          - обновлены версии и SHA-256 функционального ядра во всех контрактах.

          Предметные данные не изменялись.
          EOF
          cp build_standard_v1_1_1/P0_CORE_01_RESOLUTION.md build_standard_v1_1_1/standard_v1_1_1/P0_CORE_01_RESOLUTION.md
          cp build_standard_v1_1_1/P0_CORE_01_RESOLUTION.md build_standard_v1_1_1/system_v1_1_1/P0_CORE_01_RESOLUTION.md

      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='trajectory-visualization-system-v1.1.1'
          TITLE='Trajectory Visualization System v1.1.1'
          ASSETS=(
            build_standard_v1_1_1/TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.1.zip
            build_standard_v1_1_1/STANDARD_TRAJECTORY_VISUALIZATION_v1.1.1.zip
            build_standard_v1_1_1/TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.1.zip
            build_standard_v1_1_1/PACKAGE_SHA256_v1.1.1.txt
            build_standard_v1_1_1/BUILD_RESULT.json
            build_standard_v1_1_1/P0_CORE_01_RESOLUTION.md
            build_standard_v1_1_1/standard_v1_1_1/01_STANDARD_SPEC_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/02_FULL_GENERATION_PROMPT_RU_v1.1.1.md
            build_standard_v1_1_1/standard_v1_1_1/03_SHORT_LAUNCH_PROMPT_RU_v1.1.1.txt
            build_standard_v1_1_1/standard_v1_1_1/10_THEME_AND_CONTRAST_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/11_FINAL_PACKAGE_CONTRACT_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/18_FUNCTIONAL_CORE_MANIFEST_v1.0.1.json
            build_standard_v1_1_1/standard_v1_1_1/FUNCTIONAL_CORE_TEMPLATE_v1.0.1.html
            build_standard_v1_1_1/standard_v1_1_1/verify_functional_core.py
            build_standard_v1_1_1/standard_v1_1_1/VERIFICATION_REPORT_v1.1.1.md
            build_standard_v1_1_1/standard_v1_1_1/AUTOTEST_RESULTS_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/10_CONTRAST_TEST_RESULTS_v1.1.1.json
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            for file in "${ASSETS[@]}"; do
              name="$(basename "$file")"
              gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "${ASSETS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes 'Hotfix P0-CORE-01: функциональное ядро v1.0.1, стандарт v1.1.1, исправленный контраст активных элементов и расширенные браузерные проверки.'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.1
          path: |
            build_standard_v1_1_1/TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.1.zip
            build_standard_v1_1_1/STANDARD_TRAJECTORY_VISUALIZATION_v1.1.1.zip
            build_standard_v1_1_1/TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.1.zip
            build_standard_v1_1_1/PACKAGE_SHA256_v1.1.1.txt
            build_standard_v1_1_1/BUILD_RESULT.json
            build_standard_v1_1_1/P0_CORE_01_RESOLUTION.md
            build_standard_v1_1_1/standard_v1_1_1/01_STANDARD_SPEC_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/02_FULL_GENERATION_PROMPT_RU_v1.1.1.md
            build_standard_v1_1_1/standard_v1_1_1/03_SHORT_LAUNCH_PROMPT_RU_v1.1.1.txt
            build_standard_v1_1_1/standard_v1_1_1/10_THEME_AND_CONTRAST_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/11_FINAL_PACKAGE_CONTRACT_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/18_FUNCTIONAL_CORE_MANIFEST_v1.0.1.json
            build_standard_v1_1_1/standard_v1_1_1/FUNCTIONAL_CORE_TEMPLATE_v1.0.1.html
            build_standard_v1_1_1/standard_v1_1_1/verify_functional_core.py
            build_standard_v1_1_1/standard_v1_1_1/VERIFICATION_REPORT_v1.1.1.md
            build_standard_v1_1_1/standard_v1_1_1/AUTOTEST_RESULTS_v1.1.1.json
            build_standard_v1_1_1/standard_v1_1_1/10_CONTRAST_TEST_RESULTS_v1.1.1.json
          retention-days: 14
          compression-level: 0

      - name: Record stable release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          result = json.loads(Path('build_standard_v1_1_1/BUILD_RESULT.json').read_text(encoding='utf-8'))
          base = 'https://github.com/ithubworld25/index/releases/download/trajectory-visualization-system-v1.1.1/'
          result.update({
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'release_url': 'https://github.com/ithubworld25/index/releases/tag/trajectory-visualization-system-v1.1.1',
              'system_download_url': base + 'TRAJECTORY_VISUALIZATION_SYSTEM_v1.1.1.zip',
              'standard_download_url': base + 'STANDARD_TRAJECTORY_VISUALIZATION_v1.1.1.zip',
              'functional_reference_download_url': base + 'TRAJECTORY_FUNCTIONAL_REFERENCE_v1.0.1.zip',
              'full_prompt_url': base + '02_FULL_GENERATION_PROMPT_RU_v1.1.1.md',
              'short_prompt_url': base + '03_SHORT_LAUNCH_PROMPT_RU_v1.1.1.txt',
              'core_verifier_url': base + 'verify_functional_core.py',
              'verification_report_url': base + 'VERIFICATION_REPORT_v1.1.1.md',
              'p0_resolution_url': base + 'P0_CORE_01_RESOLUTION.md'
          })
          Path('standard_v1_1_1/LAST_BUILD.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standard_v1_1_1/LAST_BUILD.json
          git commit -m 'Record verified trajectory visualization system v1.1.1 release [skip ci]'
          git push origin HEAD:refs/heads/trajectory-standard-v1.1.1
